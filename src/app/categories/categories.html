<h2>Clothing Categories</h2>

<h3>{{ sex }} Categories</h3>

<table border="1" cellpadding="8">

  <thead>

    <tr>
      <th>ID</th>
      <th>Category</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let category of getFilteredCategories()">
      <td>
        {{ category.id }}
      </td>
      <td>
        {{ category.name }}
      </td>
      <td>
        {{ category.description }}
      </td>
    </tr>
  </tbody>
</table>
