@if (showAddForm) {
<form class="employee-card" (ngSubmit)="addEmployee()">
    <h2>Add employee</h2>
    <p>*All fields are required.</p>
    <p>
        <label>Name <input type="text" name="name" [(ngModel)]="newEmployee.name" required></label>
    </p>
    <p>
        <label>Department <input type="text" name="department" [(ngModel)]="newEmployee.department" required></label>
    </p>
    <p>
        <label>Email <input type="email" name="email" [(ngModel)]="newEmployee.email" required></label>
    </p>
    <p>
        <label>Salary <input type="number" name="salary" [(ngModel)]="newEmployee.salary" min="0" required></label>
    </p>
    <p>
        <button type="submit">Add employee</button>
    </p>
</form>
}
@if (employeeChildList; as employee) {
<article class="employee-card">
    <h2>{{ employee.name }}</h2>
    <dl>
        <dt>ID</dt>
        <dd>{{ employee.id }}</dd>
        <dt>Department</dt>
        <dd>{{ employee.department }}</dd>
        <dt>Email</dt>
        <dd>{{ employee.email }}</dd>
        <dt>Salary</dt>
        <dd>{{ employee.salary | currency }}</dd>
    </dl>
    @if (detailLink) {
    <a [routerLink]="detailLink">View details</a>
    }
</article>
}
