<section>
    <h2>Employees</h2>

    <app-employee-card [showAddForm]="true" (employeeAdded)="onEmployeeAdded($event)" />

    <div class="employee-grid">
        @for (employee of newemployeelist; track employee.id) {
            <app-employee-card [employeeChildList]="employee" />
        }
    </div>

</section>
